name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Verify tag matches package.json
        run: |
          node -e '
            const p = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (p.version !== tag) {
              console.error(`tag ${tag} != package.json ${p.version}`);
              process.exit(1);
            }
          '

      - name: Publish with OIDC
        run: pnpm publish --access public --no-git-checks

      - name: Wait for npm tarball availability
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          BASENAME=${NAME##*/}
          URL="https://registry.npmjs.org/${NAME}/-/${BASENAME}-${VERSION}.tgz"
          echo "Waiting for ${URL}"
          for i in $(seq 1 40); do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            echo "attempt ${i}/40: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Tarball is available."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Published ${NAME}@${VERSION}, but the tarball is still unavailable after 20 minutes. Check npm notifications for a possible manual review."
