<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM Texture LOD デモ | three-texture-lod</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0f15;
        --panel: rgba(10, 16, 24, 0.82);
        --line: #26364a;
        --text: #d6e2f2;
        --muted: #8ea3bb;
        --accent: #69d2ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10;
        min-width: min(300px, calc(100vw - 28px));
        max-width: min(620px, calc(100vw - 28px));
        box-sizing: border-box;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.65;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }
      #hud .title {
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #hud .muted {
        color: var(--muted);
      }
      #hud .avatars {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
      }
      #hud-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        white-space: normal;
        pointer-events: auto;
        cursor: pointer;
        user-select: none;
      }
      #hud-toggle {
        width: 20px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--accent);
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }
      #hud-body {
        max-height: calc(100vh - 110px);
        overflow: auto;
        white-space: pre-wrap;
        pointer-events: auto;
        overscroll-behavior: contain;
      }
      #hud.collapsed {
        min-width: 0;
        padding: 6px 10px;
      }
      #hud.collapsed #hud-body {
        display: none;
      }
      #hud-summary {
        display: none;
        white-space: nowrap;
        max-width: min(320px, calc(100vw - 300px));
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud.collapsed #hud-summary {
        display: inline;
      }
      /* 狭幅では折りたたみバーをトグル＋タイトルだけにし、lil-gui の下に潜らせない。 */
      @media (max-width: 640px) {
        #hud.collapsed #hud-summary {
          display: none;
        }
      }
      #hint {
        position: fixed;
        left: 14px;
        bottom: 12px;
        z-index: 10;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
        pointer-events: none;
      }
      #hint a {
        color: var(--accent);
        pointer-events: auto;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, rgba(28, 46, 66, 0.55), var(--bg) 70%);
        transition: opacity 0.35s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .card {
        min-width: 420px;
        max-width: min(680px, 90vw);
        padding: 22px 26px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      }
      #loading h1 {
        margin: 0 0 4px;
        font-size: 17px;
        color: var(--accent);
      }
      #loading .sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
      }
      #loading-status {
        font-size: 13px;
        margin-bottom: 10px;
      }
      #loading-log {
        max-height: 180px;
        overflow: auto;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
        white-space: pre-wrap;
      }
      #loading.error .card {
        border-color: #7a3040;
      }
      #loading.error h1 {
        color: #ff8a9b;
      }
      .bar {
        height: 3px;
        margin: 10px 0 12px;
        background: #1b2736;
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #3aa9ff, #7cf0c8);
        transition: width 0.25s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="hud-head">
        <button id="hud-toggle" type="button" aria-expanded="true" aria-controls="hud-body" aria-label="HUDを折りたたむ" title="HUDの折りたたみ (H)">▾</button>
        <div class="title">VRM × TEXTURE LOD</div>
        <span id="hud-summary" class="muted"></span>
      </div>
      <div id="hud-body" class="muted">loading...</div>
    </div>
    <div id="hint">
      ドラッグ&ドロップで VRM を追加 / H でHUD折りたたみ / <a href="./index.html">板ポリのLODデモへ</a>
    </div>
    <div id="loading">
      <div class="card">
        <h1>VRM を読み込み・最適化中</h1>
        <p class="sub">avatar-optimizer でアトラス化・マテリアル統合したあと、テクスチャLODを組み立てます。</p>
        <div class="bar"><i id="loading-bar"></i></div>
        <div id="loading-status">起動中...</div>
        <div id="loading-log"></div>
      </div>
    </div>
    <script type="module" src="/src/demo/vrm/main.ts"></script>
  </body>
</html>
